<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tranca Eletrônica</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f7fa;
            color: #1a1a2e;
            line-height: 1.6;
        }

        h1 {
            color: #0f3460;
            border-bottom: 3px solid #e94560;
            padding-bottom: 10px;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .badge {
            display: inline-block;
            background: #e94560;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        /* Formulário */
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0;
        }

        input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #e94560;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #0f3460;
            color: #fff;
        }
    </style>
</head>

<body>

    <h1>Tranca Eletrônica</h1>

    <!-- Card da tranca -->
    <div class="card">
        <span class="badge">Tranca</span>
        <button type="button" id="btnAbrir">Abrir tranca</button>
    </div>

    <!-- Card do histórico -->
    <div class="card">
        <span class="badge">Cadastro</span>

        <h2>Histórico de entrada</h2>

        <form id="formCadastro">

            <input 
                type="text" 
                id="Data" 
                placeholder="Data (DD/MM/AA)" 
                required
            >

            <input 
                type="text" 
                id="Horario" 
                placeholder="Horário (HH:MM)" 
                required
            >

            <input 
                type="text" 
                id="acesso" 
                placeholder="Acesso (liberado/negado)" 
                required
            >

            <button type="submit">Salvar</button>

        </form>

        <button type="button" id="btnVisualizar">
            Visualizar Histórico
        </button>

        <button type="button" id="btnBaixar">
            Baixar Histórico
        </button>

        <button type="button" id="btnLimpar">
            Limpar dados
        </button>

        <div id="tabela"></div>

    </div>

    <footer>
        Tranca Eletrônica © 2026
    </footer>

    <script>

        // ===== Cadastro com localStorage + exportação CSV =====

        const CHAVE = "entrada";

        let entrada = JSON.parse(
            localStorage.getItem(CHAVE) || "[]"
        );


        // ===== Salvar no localStorage =====

        function salvar() {
            localStorage.setItem(
                CHAVE,
                JSON.stringify(entrada)
            );
        }


        // ===== Mostrar histórico na tabela =====

        function renderizar() {

            const div = document.getElementById("tabela");

            if (entrada.length === 0) {

                div.innerHTML =
                    "<p>Nenhum registro salvo ainda.</p>";

                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Data</th>
                            <th>Horário</th>
                            <th>Acesso</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            entrada.forEach((a, i) => {

                html += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${a.Data}</td>
                        <td>${a.Horario}</td>
                        <td>${a.acesso}</td>
                    </tr>
                `;

            });

            html += `
                    </tbody>
                </table>
            `;

            div.innerHTML = html;
        }


        // ===== Cadastro =====

        document
            .getElementById("formCadastro")
            .addEventListener("submit", (e) => {

                e.preventDefault();

                const Data =
                    document.getElementById("Data").value.trim();

                const Horario =
                    document.getElementById("Horario").value.trim();

                const acesso =
                    document
                        .getElementById("acesso")
                        .value
                        .trim()
                        .toLowerCase();


                // ===== Validação da data =====

                if (!/^\d{2}\/\d{2}\/\d{2}$/.test(Data)) {

                    alert(
                        "Data inválida! Use o formato DD/MM/AA."
                    );

                    return;
                }


                // ===== Validação do horário =====

                if (!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(Horario)) {

                    alert(
                        "Horário inválido! Use o formato HH:MM."
                    );

                    return;
                }


                // ===== Validação do acesso =====

                if (
                    acesso !== "liberado" &&
                    acesso !== "negado"
                ) {

                    alert(
                        'Acesso deve ser "liberado" ou "negado".'
                    );

                    return;
                }


                // ===== Adicionar registro =====

                entrada.push({
                    Data: Data,
                    Horario: Horario,
                    acesso: acesso
                });


                // ===== Salvar e atualizar tabela =====

                salvar();

                renderizar();

                // Limpar formulário

                e.target.reset();

            });


        // ===== Botão Visualizar Histórico =====

        document
            .getElementById("btnVisualizar")
            .addEventListener("click", renderizar);


        // ===== Botão Abrir Tranca =====

        document
            .getElementById("btnAbrir")
            .addEventListener("click", () => {

                alert("Tranca aberta!");

            });


        // ===== Baixar histórico em CSV =====

        document
            .getElementById("btnBaixar")
            .addEventListener("click", () => {

                if (entrada.length === 0) {

                    alert(
                        "Não existem registros para baixar."
                    );

                    return;
                }

                const BOM = "\uFEFF";

                const linhas = [
                    "Data;Horario;Acesso"
                ];

                entrada.forEach((a) => {

                    linhas.push(
                        `${a.Data};${a.Horario};${a.acesso}`
                    );

                });


                const blob = new Blob(
                    [
                        BOM + linhas.join("\n")
                    ],
                    {
                        type: "text/csv;charset=utf-8;"
                    }
                );


                const link =
                    document.createElement("a");

                link.href =
                    URL.createObjectURL(blob);

                link.download =
                    "historico_entrada.csv";

                link.click();

                URL.revokeObjectURL(link.href);

            });


        // ===== Limpar dados =====

        document
            .getElementById("btnLimpar")
            .addEventListener("click", () => {

                if (
                    confirm(
                        "Apagar todos os registros?"
                    )
                ) {

                    entrada = [];

                    salvar();

                    renderizar();

                }

            });


        // ===== Mostrar histórico ao carregar a página =====

        renderizar();

    </script>

</body>
</html>
